name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wiskakit:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: WiskaKit
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode (WiskaKit needs a recent Swift)
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          echo "Selected $newest"
      - run: swift --version
      - name: Install Metal Toolchain (needed by MLX and whisper.cpp)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: WiskaKit logic tests
        run: swift test
